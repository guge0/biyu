<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回收站 · 笔驭</title><link rel="stylesheet" href="/styles.css?v=z1-1"></head><body><nav class="top-nav"><a href="/" class="nav-brand">笔驭</a><div class="nav-links"><a href="/">书架</a><a class="active" href="/trash.html">回收站</a></div></nav><main class="container"><h1>回收站</h1><p class="subtitle">移到回收站的书会一直留着，随时能取回来。</p><div id="trash-error" class="error-banner" role="alert" hidden><span id="trash-error-message"></span><button type="button" class="error-banner-close" aria-label="关闭">×</button></div><div id="trash-list">读取中…</div></main><script>
(async()=>{const el=document.getElementById('trash-list'),error=document.getElementById('trash-error'),message=document.getElementById('trash-error-message');document.querySelector('.error-banner-close').onclick=()=>{error.hidden=true};const speak=msg=>{message.textContent=msg;error.hidden=false};try{const r=await fetch('/api/trash/books');if(!r.ok)throw Error('读取失败');const xs=await r.json();el.replaceChildren();if(!xs.length){el.textContent='回收站是空的。';return}xs.forEach(x=>{const row=document.createElement('p');const title=document.createElement('strong');title.textContent=x.book_title;row.append(title,document.createTextNode(' · '));const button=document.createElement('button');button.type='button';button.dataset.id=x.trash_id;button.textContent='恢复到书架';button.onclick=async()=>{if(button.disabled)return;button.disabled=true;button.textContent='恢复中…';try{const response=await fetch('/api/trash/books/'+encodeURIComponent(button.dataset.id)+'/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor:'author'})});if(!response.ok){const body=await response.json().catch(()=>({}));throw Error(body.detail||'恢复失败')}location.reload()}catch(exc){speak(exc.message);button.disabled=false;button.textContent='恢复到书架'}};row.append(button);el.append(row)})}catch(e){speak('回收站读取失败：'+e.message);el.textContent='回收站暂时无法读取。'}})();
</script></body></html>
